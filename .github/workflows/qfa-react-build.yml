name: QFA React frontend build
on:
  push:
    branches: [feature/react-migration]
    paths:
      - 'frontend/**'
      - 'routes/**'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/qfa-react-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'routes/**'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/qfa-react-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Check additive API route syntax
        run: node --check ../routes/client-portal.js && node --check ../routes/portfolio.js && node --check ../routes/timer.js && node --check ../routes/contracts.js && node --check ../routes/fixed-payments.js && node --check ../server.js
