<script>
const API = 'https://freelancer-platform-9jut.onrender.com/api';
const auth = {
  token: () => localStorage.getItem('token'),
  user:  () => { try { return JSON.parse(localStorage.getItem('user')); } catch { return null; } },
  clear: () => { localStorage.removeItem('token'); localStorage.removeItem('user'); },
  isLoggedIn: () => !!localStorage.getItem('token'),
  headers: () => ({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') })
};

async function apiFetch(path, options = {}) {
  const res = await fetch(API + path, { ...options, headers: { ...auth.headers(), ...(options.headers||{}) } });
  if (res.status === 401) { auth.clear(); window.location.href = 'login.html'; return; }
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error||'Failed'); }
  return res.json();
}

(function() {
  if (!auth.isLoggedIn()) { window.location.href = 'login.html'; return; }
  document.getElementById('user-name').textContent = auth.user()?.name || '';
})();

function logout() { auth.clear(); window.location.href = 'login.html'; }

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('mobile-open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}

let selectedIds = new Set();
let allClients  = [];

// ── Fetch & Populate Client Dropdowns ────────────────────────
async function fetchAndPopulateClients() {
  try {
    allClients = await apiFetch('/clients');
    const opts = allClients.map(c =>
      `<option value="${c.id}" data-rate="${c.rate_type}" data-hourly="${c.hourly_rate||0}" data-fixed="${c.fixed_price||0}" data-credit="${c.credit_balance||0}">${c.name}${c.company?' — '+c.company:''}</option>`
    ).join('');
    
    const filterSelect = document.getElementById('filter-client');
    const paymentSelect = document.getElementById('payment-client');
    
    const previousFilterVal = filterSelect.value;
    const previousPaymentVal = paymentSelect.value;

    filterSelect.innerHTML = '<option value="">All clients</option>' + opts;
    paymentSelect.innerHTML = '<option value="">Select client...</option>' + opts;
    
    filterSelect.value = previousFilterVal;
    paymentSelect.value = previousPaymentVal;
  } catch(e) { console.error('Error fetching clients:', e); }
}

// ── Unified Filter & Client Change Handler ─────────────────
async function handleFilterChange() {
  const filterSelect = document.getElementById('filter-client');
  const clientId = filterSelect.value;
  const selectedOpt = filterSelect.selectedOptions[0];
  const isFixed = selectedOpt && selectedOpt.value !== "" && selectedOpt.dataset.rate === 'fixed';

  // Containers
  const fixedContainer = document.getElementById('fixedRateMonthlyContainer');
  const logsCard       = document.getElementById('logs-card');
  const statsRow       = document.getElementById('stats-row');
  const creditDisplay  = document.getElementById('client-credit-display');

  // Live credit display preservation
  if (selectedOpt && selectedOpt.value !== "") {
    const balance = parseFloat(selectedOpt.dataset.credit || 0);
    if (creditDisplay) {
      creditDisplay.textContent = `(Available Credit: $${balance.toFixed(2)})`;
    }
  } else {
    if (creditDisplay) creditDisplay.textContent = '';
  }

  if (isFixed && clientId) {
    if (fixedContainer) fixedContainer.style.display = 'block';
    if (logsCard) logsCard.style.display = 'none';
    if (statsRow) statsRow.style.display = 'none';

    await loadFixedClientMonthlyRecords(clientId);
  } else {
    if (fixedContainer) fixedContainer.style.display = 'none';
    if (logsCard) logsCard.style.display = 'block';
    if (statsRow) statsRow.style.display = 'grid';

    loadLogs();
  }
}

// ── Load Fixed-Rate Monthly Billing Periods ────────────────
async function loadFixedClientMonthlyRecords(clientId) {
  const tbody = document.getElementById('fixedMonthlyTableBody');
  if (!tbody) return;

  tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted" style="text-align:center;padding:2rem;">Loading monthly billing periods...</td></tr>`;

  try {
    const records = await apiFetch(`/fixed-payments/${clientId}`);
    renderFixedMonthlyTable(records, clientId);
  } catch (err) {
    console.error('Error loading fixed monthly records:', err);
    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger" style="text-align:center;padding:2rem;color:var(--red);">Error loading data: ${err.message}</td></tr>`;
  }
}

function renderFixedMonthlyTable(records, clientId) {
  const tbody = document.getElementById('fixedMonthlyTableBody');
  if (!tbody) return;

  if (!records || records.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted" style="text-align:center;padding:2rem;">No monthly billing records found.</td></tr>`;
    return;
  }

  tbody.innerHTML = records.map(record => {
    const isPaid = record.status === 'paid';
    return `
      <tr>
        <td><strong>${record.month}</strong></td>
        <td>$${parseFloat(record.amount || 0).toFixed(2)}</td>
        <td>
          <span class="badge ${isPaid ? 'badge-green' : 'badge-amber'}">
            ${isPaid ? '✓ Paid' : 'Pending'}
          </span>
          ${record.paid_at ? `<br><small class="text-muted">Paid: ${new Date(record.paid_at).toLocaleDateString()}</small>` : ''}
        </td>
        <td>
          <button class="btn btn-sm ${isPaid ? 'btn-outline' : 'btn-green'}"
              onclick="toggleFixedMonthlyRecordStatus('${record.id}', '${isPaid ? 'unpaid' : 'paid'}', '${clientId}')">
              ${isPaid ? 'Mark Unpaid' : 'Mark Paid ✓'}
          </button>
        </td>
      </tr>
    `;
  }).join('');
}

async function toggleFixedMonthlyRecordStatus(recordId, newStatus, clientId) {
  try {
    await apiFetch(`/fixed-payments/${recordId}/status`, {
      method: 'PATCH',
      body: JSON.stringify({ status: newStatus })
    });
    await loadFixedClientMonthlyRecords(clientId);
  } catch (err) {
    alert('Error updating payment status: ' + err.message);
  }
}

// ── Load Hourly Logs ────────────────────────────────────────
async function loadLogs() {
  const clientId = document.getElementById('filter-client').value;
  const payment  = document.getElementById('filter-payment').value;
  const from     = document.getElementById('filter-from').value;
  const to       = document.getElementById('filter-to').value;

  let url = '/timelogs?limit=200';
  if (clientId) url += '&client_id=' + clientId;
  if (payment)  url += '&payment_status=' + payment;
  if (from)     url += '&from=' + from;
  if (to)       url += '&to='   + to;

  try {
    const logs  = await apiFetch(url);
    const tbody = document.getElementById('logs-table');
    let totalPaid = 0, totalUnpaid = 0, totalHours = 0;

    if (!logs.length) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:2rem;color:var(--ink3)">No logs found.</td></tr>';
    } else {
      tbody.innerHTML = logs.map(l => {
        const isPaid = l.payment_status === 'paid';
        const amount = parseFloat(l.amount || 0);
        if (isPaid) totalPaid += amount; else totalUnpaid += amount;
        totalHours += parseFloat(l.hours || 0);
        const badge  = isPaid ? '<span class="badge badge-green">✓ Paid</span>' : '<span class="badge badge-amber">Unpaid</span>';
        const payBtn = isPaid
          ? `<button class="btn btn-outline" onclick="togglePayment(${l.id},'unpaid')">Undo</button>`
          : `<button class="btn btn-green" onclick="togglePayment(${l.id},'paid')">Paid ✓</button>`;
        const checked = selectedIds.has(l.id) ? 'checked' : '';
        const cl = allClients.find(c => c.id === l.client_id) || {};
        return `<tr style="${!isPaid?'background:rgba(255,200,100,0.04)':''}">
          <td><input type="checkbox" class="row-check" value="${l.id}" ${checked} onchange="updateSel(${l.id},this.checked)"/></td>
          <td><strong>${l.client_name}</strong></td>
          <td style="white-space:nowrap">${new Date(l.date).toLocaleDateString()}</td>
          <td>${fmtHours(parseFloat(l.hours))}</td>
          <td><span class="badge ${l.rate_type==='fixed'?'badge-blue':'badge-green'}">${l.rate_type||'hourly'}</span></td>
          <td>${amount>0?'<strong>$'+amount.toFixed(2)+'</strong>':'—'}</td>
          <td>${badge}</td>
          <td style="max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${l.task_description}">${l.task_description}</td>
          <td style="display:flex;gap:0.3rem;flex-wrap:wrap">
            ${payBtn}
            <button class="btn btn-outline" onclick="openEdit(${l.id},'${l.date}',${l.hours},'${l.task_description.replace(/'/g,"\\'")}',${l.client_id},'${l.rate_type||'hourly'}',${cl.hourly_rate||0})">✏️</button>
          </td>
        </tr>`;
      }).join('');
    }

    document.getElementById('total-paid').textContent   = '$' + totalPaid.toFixed(2);
    document.getElementById('total-unpaid').textContent = '$' + totalUnpaid.toFixed(2);
    document.getElementById('total-hours').textContent  = fmtHours(totalHours);
    document.getElementById('total-entries').textContent = logs.length;
    updateBulkBar();
  } catch(e) { console.error(e); }
}

function fmtHours(h) {
  const hrs = Math.floor(h), mins = Math.round((h - hrs) * 60);
  if (hrs === 0) return `${mins}min`;
  if (mins === 0) return `${hrs}h`;
  return `${hrs}h ${mins}min`;
}

// ── Submit Payment Remittance ──────────────────────────────
async function handleRecordPayment(event) {
  event.preventDefault();
  const clientId = document.getElementById('payment-client').value;
  const amount   = document.getElementById('payment-amount').value;
  const date     = document.getElementById('payment-date').value;

  if (!clientId || !amount || !date) {
    alert('Please fill out all fields.');
    return;
  }

  try {
    const result = await apiFetch('/payments/record-admin', {
      method: 'POST',
      body: JSON.stringify({
        client_id: parseInt(clientId),
        amount: parseFloat(amount),
        date: date,
        notes: `Manual balance posting via Freelancer Time Logs layout UI.`
      })
    });

    alert(`Success! ${result.message}\nRecalculated surplus retainer balance of $${result.remainingCreditSurplus.toFixed(2)} credited forward.`);
    document.getElementById('payment-amount').value = '';
    await fetchAndPopulateClients();
    handleFilterChange();
  } catch (err) {
    alert('Payment Allocation Error: ' + err.message);
  }
}

async function togglePayment(id, status) {
  try {
    await apiFetch('/timelogs/'+id+'/payment',{method:'PATCH',body:JSON.stringify({payment_status:status})});
    loadLogs();
  } catch(e){alert('Failed: '+e.message);}
}

function openEdit(id, date, hours, task, clientId, rateType, hourlyRate) {
  document.getElementById('edit-id').value         = id;
  document.getElementById('edit-client-id').value  = clientId;
  document.getElementById('edit-rate-type').value  = rateType;
  document.getElementById('edit-hourly-rate').value = hourlyRate;
  document.getElementById('edit-date').value        = date.slice(0,10);
  document.getElementById('edit-hours').value       = hours;
  document.getElementById('edit-task').value        = task;
  document.getElementById('edit-status').textContent = '';

  const cl = allClients.find(c => c.id === clientId);
  if (cl) {
    const rateLabel = rateType === 'hourly' ? `Hourly @ $${hourlyRate}/hr` : `Fixed @ $${cl.fixed_price}`;
    document.getElementById('edit-client-info').innerHTML = `<strong>${cl.name}</strong> &nbsp;·&nbsp; ${rateLabel}`;
  }

  previewAmount();
  document.getElementById('modal-edit').classList.add('open');
}

function previewAmount() {
  const hours      = parseFloat(document.getElementById('edit-hours').value || 0);
  const rateType   = document.getElementById('edit-rate-type').value;
  const hourlyRate = parseFloat(document.getElementById('edit-hourly-rate').value || 0);
  const preview    = document.getElementById('amount-preview');

  if (hours > 0 && rateType === 'hourly' && hourlyRate > 0) {
    const amount = (hours * hourlyRate).toFixed(2);
    preview.textContent = `💰 New amount: $${amount} (${fmtHours(hours)} × $${hourlyRate}/hr)`;
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
}

async function saveEdit() {
  const status     = document.getElementById('edit-status');
  const id         = document.getElementById('edit-id').value;
  const hours      = parseFloat(document.getElementById('edit-hours').value);
  const rateType   = document.getElementById('edit-rate-type').value;
  const hourlyRate = parseFloat(document.getElementById('edit-hourly-rate').value || 0);
  const date       = document.getElementById('edit-date').value;
  const task       = document.getElementById('edit-task').value;

  let amount = 0;
  if (rateType === 'hourly' && hourlyRate > 0) amount = hours * hourlyRate;

  try {
    await apiFetch('/timelogs/' + id, {
      method: 'PUT',
      body: JSON.stringify({ hours, task_description: task, date, amount: amount.toFixed(2) })
    });
    status.className = 'form-status success';
    status.textContent = '✓ Updated!';
    setTimeout(() => { closeModal(); handleFilterChange(); }, 700);
  } catch(err) {
    status.className = 'form-status error';
    status.textContent = err.message;
  }
}

function closeModal() { document.getElementById('modal-edit').classList.remove('open'); }

function updateSel(id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  updateBulkBar();
}
function toggleAll(cb) {
  document.querySelectorAll('.row-check').forEach(c => { c.checked = cb.checked; updateSel(parseInt(c.value), cb.checked); });
}
function selectAllVisible() {
  document.querySelectorAll('.row-check').forEach(c => { c.checked = true; selectedIds.add(parseInt(c.value)); });
  updateBulkBar();
}
function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('.row-check').forEach(c => c.checked = false);
  document.getElementById('check-all').checked = false;
  updateBulkBar();
}
function updateBulkBar() {
  const bar = document.getElementById('bulk-bar');
  if (selectedIds.size > 0) {
    bar.classList.add('open');
    document.getElementById('bulk-count').textContent = selectedIds.size + ' selected';
  } else {
    bar.classList.remove('open');
  }
}
async function bulkMarkPaid() {
  if (!selectedIds.size) return;
  if (!confirm(`Mark ${selectedIds.size} log(s) as paid?`)) return;
  try {
    await apiFetch('/timelogs/bulk-payment',{method:'PATCH',body:JSON.stringify({ids:[...selectedIds],payment_status:'paid'})});
    clearSelection(); handleFilterChange();
  } catch(e){alert('Failed: '+e.message);}
}

function clearFilters() {
  document.getElementById('filter-client').value  = '';
  document.getElementById('filter-payment').value = '';
  document.getElementById('filter-from').value    = '';
  document.getElementById('filter-to').value      = '';
  handleFilterChange();
}

// ── Init ────────────────────────────────---------------------
async function init() {
  document.getElementById('payment-date').value = new Date().toISOString().split('T')[0];
  
  const today = new Date();
  const fiveDaysAgo = new Date();
  fiveDaysAgo.setDate(today.getDate() - 5);
  
  document.getElementById('filter-to').value = today.toISOString().split('T')[0];
  document.getElementById('filter-from').value = fiveDaysAgo.toISOString().split('T')[0];
  
  await fetchAndPopulateClients();
  handleFilterChange();
}

init();
</script>
