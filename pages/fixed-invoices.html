<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invoices — Quick Freelancing Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Outfit:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0d2353; --navy2: #1a3a7a; --navy-deep: #071633; --accent: #1a5cff; --gold2: #c9a44c;
      --white: #fff; --bg: #f4f6fb; --bg2: #eef1f8;
      --ink: #0d2353; --ink2: #3a4a6a; --ink3: #7a8aaa;
      --green: #10b981; --amber: #f59e0b;
      --sans: 'Outfit', system-ui, sans-serif;
      --serif: 'Playfair Display', serif;
      --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --radius: 16px;
    }
    html, body { font-family: var(--sans); background: var(--bg); color: var(--ink); }
    .layout { display: flex; min-height: 100vh; }

    .sidebar {
      width: 220px; background: var(--navy); position: fixed;
      top: 0; left: 0; height: 100vh; display: flex;
      flex-direction: column; z-index: 50;
    }
    .sidebar-brand {
      padding: 1.1rem 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; gap: 0.6rem;
    }
    .brand-logo { width: 36px; height: 36px; background: white; border-radius: 8px; overflow: hidden; padding: 3px; flex-shrink: 0; }
    .brand-logo img { width: 100%; height: 100%; object-fit: contain; }
    .brand-text strong { display: block; color: white; font-size: 0.78rem; font-weight: 700; }
    .brand-text span { font-size: 0.62rem; color: var(--gold2); text-transform: uppercase; letter-spacing: 0.08em; }

    .sidebar-nav { flex: 1; padding: 0.8rem 0; overflow-y: auto; }
    .sidebar-nav a {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.7rem 1.2rem; font-size: 0.85rem; font-weight: 500;
      color: rgba(255,255,255,0.55); text-decoration: none;
      transition: all 0.2s; border-right: 3px solid transparent;
    }
    .sidebar-nav a:hover { color: white; background: rgba(255,255,255,0.06); }
    .sidebar-nav a.active { color: white; background: rgba(26,92,255,0.2); border-right-color: var(--gold2); }

    .sidebar-user {
      padding: 1rem 1.2rem; border-top: 1px solid rgba(255,255,255,0.08); font-size: 0.8rem;
    }
    .sidebar-user strong { display: block; color: white; margin-bottom: 0.1rem; }
    .sidebar-user span { color: rgba(255,255,255,0.4); font-size: 0.72rem; }
    .sidebar-user a { display: block; margin-top: 0.4rem; font-size: 0.75rem; color: var(--gold2); text-decoration: none; }

    .main { margin-left: 220px; flex: 1; min-height: 100vh; display: flex; flex-direction: column; }

    .topbar {
      background: white; border-bottom: 1px solid rgba(13,35,83,0.08);
      padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar h2 { font-family: var(--serif); font-size: 1.4rem; }

    .content { padding: 1.5rem; flex: 1; }

    .card {
      background: white; border-radius: 18px; padding: 1.5rem;
      box-shadow: 0 10px 30px -14px rgba(13,35,83,0.14);
      border: 1px solid rgba(13,35,83,0.05); margin-bottom: 1.5rem;
    }
    .card-header {
      padding-bottom: 1rem; border-bottom: 1px solid var(--bg2); margin-bottom: 1.1rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-header h3 { font-size: 1rem; font-weight: 700; font-family: var(--serif); color: var(--navy); }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { text-align: left; padding: 0.8rem 1rem; color: var(--ink3); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 2px solid var(--bg2); font-weight: 600; }
    td { padding: 0.9rem 1rem; border-bottom: 1px solid var(--bg2); }
    tbody tr:nth-child(even) td { background: rgba(13,35,83,0.02); }

    .badge {
      display: inline-block; padding: 0.25rem 0.6rem; font-size: 0.7rem; font-weight: 700;
      border-radius: 6px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .badge.outstanding { background: rgba(245,158,11,0.15); color: #d97706; }
    .badge.paid { background: rgba(16,185,129,0.15); color: #059669; }

    .btn {
      background: linear-gradient(135deg, var(--navy), var(--navy-deep));
      color: white; padding: 0.4rem 0.8rem; font-size: 0.75rem; font-weight: 600;
      border-radius: 8px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem;
      text-decoration: none; box-shadow: 0 4px 12px -4px rgba(13,35,83,0.3);
    }
    .btn:hover { background: linear-gradient(135deg, var(--accent), var(--navy)); }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
    }
  </style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo"><img src="../QFA_Logo.png" alt="QFA"/></div>
      <div class="brand-text"><strong>Quick Freelancing</strong><span>Agency</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">📊 Overview</a>
      <a href="time-logs.html">⏱ Time Logs</a>
      <a href="clients.html">👥 Clients</a>
      <a href="schedule.html">📅 Schedule</a>
      <a href="reports.html">📈 Reports</a>
      <a href="fixed-invoices.html" class="active">📄 Invoices</a>
      <a href="portfolio-admin.html">🖼 Portfolio</a>
    </nav>
    <div class="sidebar-user">
      <strong id="user-name">Loading…</strong>
      <span>Freelancer · QFA</span>
      <a href="#" onclick="logout()">Sign out →</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h2>Generated Invoices</h2>
    </div>

    <div class="content">
      <div class="card">
        <div class="card-header">
          <h3>Client Invoices & Actions</h3>
        </div>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Invoice ID</th>
                <th>Client</th>
                <th>Hours</th>
                <th>Outstanding</th>
                <th>Paid</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="invoices-body">
              <tr><td colspan="7" style="text-align:center; color:var(--ink3);">Loading invoices...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://freelancer-platform-9jut.onrender.com/api';
const auth = {
  token: () => localStorage.getItem('token'),
  user:  () => { try { return JSON.parse(localStorage.getItem('user')); } catch { return null; } },
  clear: () => { localStorage.removeItem('token'); localStorage.removeItem('user'); },
  isLoggedIn: () => !!localStorage.getItem('token'),
  headers: () => ({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') })
};

if (!auth.isLoggedIn()) { window.location.href = 'login.html'; }
document.getElementById('user-name').textContent = auth.user()?.name || '';
function logout() { auth.clear(); window.location.href = 'login.html'; }

document.addEventListener('DOMContentLoaded', loadInvoicesData);

async function loadInvoicesData() {
  try {
    const [invoicesRes, clientsRes] = await Promise.all([
      fetch(`${API}/invoices`, { headers: auth.headers() }).then(res => res.ok ? res.json() : []).catch(() => []),
      fetch(`${API}/clients`, { headers: auth.headers() }).then(res => res.ok ? res.json() : []).catch(() => [])
    ]);

    const invoicesList = Array.isArray(invoicesRes) ? invoicesRes : (invoicesRes.data || invoicesRes.invoices || []);
    const clientsList = Array.isArray(clientsRes) ? clientsRes : (clientsRes.data || clientsRes.clients || []);

    const clientPhoneMap = {};
    clientsList.forEach(c => {
      const name = c.name || c.client_name;
      if (name) clientPhoneMap[name] = c.phone || '';
    });

    const tbody = document.getElementById('invoices-body');
    if (!invoicesList.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--ink3);">No invoices found.</td></tr>';
      return;
    }

    tbody.innerHTML = '';
    invoicesList.forEach(inv => {
      const phone = clientPhoneMap[inv.client_name] || '';
      const outstandingVal = parseFloat(inv.outstanding || inv.amount || 0);
      const message = encodeURIComponent(`Hi ${inv.client_name},\n\nHere is your invoice summary (${inv.invoice_id}) for $${outstandingVal.toFixed(2)}.\n\nYou can download the full PDF from your portal. Let me know if you have questions!`);
      const waUrl = phone ? `https://wa.me/${phone}?text=${message}` : `https://wa.me/?text=${message}`;

      tbody.innerHTML += `
        <tr>
          <td><strong>${inv.invoice_id}</strong></td>
          <td>${inv.client_name}</td>
          <td>${inv.hours || 0}</td>
          <td style="font-family:var(--mono); color:#ef4444;">$${outstandingVal.toFixed(2)}</td>
          <td style="font-family:var(--mono); color:#10b981;">$${parseFloat(inv.paid || 0).toFixed(2)}</td>
          <td><span class="badge ${inv.status}">${inv.status}</span></td>
          <td>
            <div style="display: flex; gap: 0.4rem; align-items: center;">
              <a href="${inv.pdf_url || '#'}" target="_blank" class="btn">↓ PDF</a>
              <a href="${waUrl}" target="_blank" class="btn" style="background: #25D366; box-shadow: none;">💬 WhatsApp</a>
            </div>
          </td>
        </tr>`;
    });
  } catch(e) {
    console.error("Error loading invoices:", e);
    document.getElementById('invoices-body').innerHTML = '<tr><td colspan="7" style="text-align:center; color:#ef4444;">Failed to load invoices. Check console.</td></tr>';
  }
}
</script>
</body>
</html>
