<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invoice Hub — QFA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght=700&family=Outfit:wght=300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0d2353; --navy2: #1a3a7a; --accent: #1a5cff; --gold2: #f5c842;
      --white: #fff; --bg: #f4f6fb; --bg2: #eef1f8;
      --ink: #0d2353; --ink2: #3a4a6a; --ink3: #7a8aaa;
      --sans: 'Outfit', system-ui, sans-serif;
      --serif: 'Playfair Display', serif;
      --radius: 14px; --shadow: 0 2px 20px rgba(13,35,83,0.08);
    }
    html, body { font-family: var(--sans); background: var(--bg); color: var(--ink); }

    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: var(--navy); position: fixed; top: 0; left: 0; height: 100vh; display: flex; flex-direction: column; z-index: 50; }
    .sidebar-brand { padding: 1.1rem 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 0.6rem; }
    .brand-logo { width: 36px; height: 36px; background: white; border-radius: 8px; overflow: hidden; padding: 3px; }
    .brand-logo img { width: 100%; height: 100%; object-fit: contain; }
    .brand-text strong { display: block; color: white; font-size: 0.78rem; font-weight: 700; }
    .brand-text span { font-size: 0.62rem; color: var(--gold2); text-transform: uppercase; letter-spacing: 0.08em; }
    .sidebar-nav { flex: 1; padding: 0.8rem 0; overflow-y: auto; }
    .sidebar-nav a { display: flex; align-items: center; gap: 0.7rem; padding: 0.7rem 1.2rem; font-size: 0.85rem; font-weight: 500; color: rgba(255,255,255,0.55); text-decoration: none; border-right: 3px solid transparent; }
    .sidebar-nav a:hover, .sidebar-nav a.active { color: white; background: rgba(255,255,255,0.06); }
    .sidebar-nav a.active { background: rgba(26,92,255,0.2); border-right-color: var(--gold2); }

    .main { margin-left: 220px; flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { background: white; border-bottom: 1px solid rgba(13,35,83,0.08); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 40; }
    .topbar h2 { font-family: var(--serif); font-size: 1.4rem; }
    .content { padding: 1.5rem; flex: 1; }

    .card { background: white; border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow); border: 1px solid rgba(13,35,83,0.05); margin-bottom: 1.2rem; }
    .card-header { padding-bottom: 1rem; border-bottom: 1px solid var(--bg2); display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    
    .filter-row { display: flex; gap: 1rem; align-items: flex-end; margin-bottom: 1.5rem; background: #eef1f8; padding: 1rem; border-radius: 8px; }
    .filter-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .filter-group label { font-size: 0.75rem; font-weight: 600; color: var(--ink2); }
    .filter-row select, .filter-row input { padding: 0.45rem 0.8rem; border: 1.5px solid rgba(13,35,83,0.1); border-radius: 6px; font-family: var(--sans); min-width: 160px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; padding: 0.6rem 0.8rem; color: var(--ink3); font-size: 0.68rem; text-transform: uppercase; border-bottom: 2px solid var(--bg2); }
    td { padding: 0.8rem 0.8rem; border-bottom: 1px solid var(--bg2); color: var(--ink2); }

    .btn { background: var(--navy); color: white; padding: 0.5rem 1rem; font-size: 0.8rem; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
    .btn:hover { background: var(--accent); }
    .btn-outline { background: transparent; border: 1.5px solid rgba(13,35,83,0.15); color: var(--ink2); }
    .btn-outline:hover { border-color: var(--navy); color: var(--navy); }
  </style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo"><img src="../QFA_Logo.png" alt="QFA"/></div>
      <div class="brand-text"><strong>Quick Freelancing</strong><span>Agency</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">📊 Overview</a>
      <a href="time-logs.html">⏱ Time Logs</a>
      <a href="clients.html">👥 Clients</a>
      <a href="reports.html">📈 Reports</a>
      <a href="fixed-invoices.html" class="active">📄 Invoices</a>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <h2>Invoice History Engine</h2>
    </div>

    <div class="content">
      <!-- Advanced Query Controls Area -->
      <div class="card">
        <div class="card-header"><h3>Filter Matrix Statement Parameters</h3></div>
        <div class="filter-row">
          <div class="filter-group">
            <label>Select Target Account</label>
            <select id="client-select">
              <option value="">-- All Dynamic Clients --</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Start Timeline</label>
            <input type="date" id="start-date"/>
          </div>
          <div class="filter-group">
            <label>End Timeline</label>
            <input type="date" id="end-date"/>
          </div>
          <button class="btn" onclick="applyTimeWindowFilters()">🔍 Filter Ledger</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>System Invoice Records Matrix</h3>
        </div>
        <table>
          <thead>
            <tr>
              <th>Invoice ID</th>
              <th>Client Profile Details</th>
              <th>Hours Tracked</th>
              <th>Total Billing Volume</th>
              <th>Status Matrix</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="invoice-records-table">
            <tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--ink3)">Applying data streams...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://freelancer-platform-9jut.onrender.com/api';
const headers = () => ({ 'Authorization': 'Bearer ' + localStorage.getItem('token'), 'Content-Type': 'application/json' });

let rawLogsData = [];

document.addEventListener('DOMContentLoaded', async () => {
  // Set default timeline window to current year start until today
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('start-date').value = "2026-01-01";
  document.getElementById('end-date').value = today;

  await populateClientSelector();
  await fetchMasterLogs();
});

async function populateClientSelector() {
  try {
    const res = await fetch(`${API}/clients`, { headers: headers() });
    const clients = await res.json();
    const selector = document.getElementById('client-select');
    clients.forEach(c => {
      selector.innerHTML += `<option value="${c.name}">${c.name}</option>`;
    });
  } catch(e) { console.error("Client selector setup failure:", e); }
}

async function fetchMasterLogs() {
  try {
    const res = await fetch(`${API}/timelogs`, { headers: headers() });
    rawLogsData = await res.json();
    applyTimeWindowFilters();
  } catch(e) { console.error("Logs processing error:", e); }
}

function applyTimeWindowFilters() {
  const selectedClient = document.getElementById('client-select').value;
  const start = document.getElementById('start-date').value;
  const end = document.getElementById('end-date').value;

  // Filter out records based on structural input criteria ranges
  let records = rawLogsData.filter(l => {
    const logDate = l.date.slice(0, 10);
    const matchesClient = !selectedClient || l.client_name === selectedClient;
    const matchesStart = !start || logDate >= start;
    const matchesEnd = !end || logDate <= end;
    return matchesClient && matchesStart && matchesEnd;
  });

  // Group items cleanly by client name for multi-month rollup visibility
  const clientGroups = {};
  records.forEach(r => {
    if(!clientGroups[r.client_name]) {
      clientGroups[r.client_name] = { hours: 0, total: 0, items: [], unpaid: false };
    }
    clientGroups[r.client_name].hours += parseFloat(r.hours || 0);
    clientGroups[r.client_name].total += parseFloat(r.amount || 0);
    clientGroups[r.client_name].items.push(r);
    if(r.payment_status !== 'paid') clientGroups[r.client_name].unpaid = true;
  });

  const tableBody = document.getElementById('invoice-records-table');
  const groupsArray = Object.keys(clientGroups);

  if(!groupsArray.length) {
    tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--ink3)">No records match the requested parameter ranges.</td></tr>';
    return;
  }

  tableBody.innerHTML = groupsArray.map((client, idx) => {
    const data = clientGroups[client];
    const dummyInvId = `INV-2026-${2000 + idx}`;
    
    return `
      <tr>
        <td><strong>${dummyInvId}</strong></td>
        <td><strong>${client}</strong></td>
        <td>${data.hours.toFixed(2)} Hrs</td>
        <td><strong>$${data.total.toFixed(2)}</strong></td>
        <td>
          ${data.unpaid ? '<span style="color:#92400e; background:#fef3c7; padding:2px 8px; border-radius:10px; font-size:11px;">Outstanding Balance</span>' 
                        : '<span style="color:#166534; background:#dcfce7; padding:2px 8px; border-radius:10px; font-size:11px;">Paid</span>'}
        </td>
        <td>
          <button class="btn btn-outline" onclick="generateTimeWindowPDF('${dummyInvId}', '${client}', ${data.hours}, ${data.total}, '${start}', '${end}')">
            📄 Generate Invoice PDF
          </button>
        </td>
      </tr>`;
  }).join('');
}

function generateTimeWindowPDF(invId, clientName, hours, totalAmount, start, end) {
  const iframe = document.createElement('iframe');
  iframe.style.position = 'fixed'; iframe.style.bottom = '0'; iframe.style.width = '0'; iframe.style.height = '0'; iframe.style.border = 'none';
  document.body.appendChild(iframe);

  const doc = iframe.contentWindow.document;

  const invoiceHTML = `
    <!DOCTYPE html>
    <html>
    <head>
      <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #0d2353; padding: 40px; line-height: 1.5; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #eef1f8; padding-bottom: 20px; align-items: center; }
        .logo-section { display: flex; align-items: center; gap: 15px; }
        .logo-img { width: 50px; height: 50px; border-radius: 8px; border: 1px solid #eef1f8; }
        .logo-section h2 { font-size: 22px; margin: 0; color: #0d2353; }
        .logo-section span { font-size: 11px; color: #f5c842; text-transform: uppercase; letter-spacing: 1px; display: block; }
        .inv-details { text-align: right; font-size: 13px; }
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 30px; font-size: 13px; }
        .meta-box h3 { font-size: 11px; text-transform: uppercase; color: #7a8aaa; margin-bottom: 6px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 40px; font-size: 13px; }
        th { background: #f4f6fb; text-align: left; padding: 10px; font-size: 11px; text-transform: uppercase; color: #3a4a6a; }
        td { padding: 12px 10px; border-bottom: 1px solid #eef1f8; }
        .totals { display: flex; flex-direction: column; align-items: flex-end; margin-top: 30px; font-size: 14px; }
        .grand-total { font-size: 18px; font-weight: bold; color: #1a5cff; border-top: 2px solid #0d2353; padding-top: 8px; margin-top: 8px; }
        .footer { margin-top: 80px; text-align: center; font-size: 11px; color: #7a8aaa; border-top: 1px solid #eef1f8; padding-top: 15px; }
      </style>
    </head>
    <body>
      <div class="header">
        <div class="logo-section">
          <!-- Dynamically referencing asset relative to root -->
          <img src="../QFA_Logo.png" class="logo-img" alt="QFA" onerror="this.style.display='none'"/>
          <div>
            <h2>Quick Freelancing Agency</h2>
            <span>Project Operations Statement</span>
          </div>
        </div>
        <div class="inv-details">
          <strong>Invoice Reference:</strong> ${invId}<br/>
          <strong>Statement Timeline:</strong> ${start} to ${end}<br/>
          <strong>Issued:</strong> ${new Date().toLocaleDateString()}
        </div>
      </div>

      <div class="meta-grid">
        <div class="meta-box">
          <h3>Issued By:</h3>
          <strong>Quick Freelancing Agency (QFA)</strong><br/>
          📧 Email: ndy.andupa@gmail.com<br/>
          📞 Phone: +251911859866
        </div>
        <div class="meta-box">
          <h3>Prepared For:</h3>
          <strong>Client Account: ${clientName}</strong><br/>
          Corporate Accounts Management Group
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Description of Services Block</th>
            <th>Calculated Volume Metrics</th>
            <th>Total Outstanding Balance</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Aggregated Contract Deliverables and Time Tracking Sessions accrued inside requested timeline snapshot window.</td>
            <td>${hours > 0 ? `${hours.toFixed(2)} Hours Accumulated` : 'Fixed Structure Rate Segment'}</td>
            <td><strong>$${totalAmount.toFixed(2)}</strong></td>
          </tr>
        </tbody>
      </table>

      <div class="totals">
        <div>Subtotal Accumulation: $${totalAmount.toFixed(2)}</div>
        <div class="grand-total">Total Balance Due: $${totalAmount.toFixed(2)}</div>
      </div>

      <div class="footer">
        Thank you for choosing Quick Freelancing Agency. For immediate validation requests, use our secure channel coordinates listed above.<br/>
        <strong>QFA Portfolio System Architecture — 2026</strong>
      </div>
    </body>
    </html>
  `;

  doc.open();
  doc.write(invoiceHTML);
  doc.close();

  iframe.contentWindow.focus();
  setTimeout(() => {
    iframe.contentWindow.print();
    document.body.removeChild(iframe);
  }, 600);
}
</script>
</body>
</html>
