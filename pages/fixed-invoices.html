<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statement of Account - Freelance Suite</title>
  <!-- html2pdf library for mobile-friendly PDF exports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --gold: #f59e0b;
      --gold2: #fbbf24;
      --success: #10b981;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { margin-bottom: 5px; }
    .subtitle { color: var(--text-muted); margin-bottom: 25px; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 10px;
    }
    .stat-card h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: var(--text-muted); }
    .stat-card .value { font-size: 1.6rem; font-weight: 700; }

    .filters-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 25px;
      align-items: center;
    }
    .filters-bar label { font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 5px; }
    .filters-bar select, .filters-bar input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: rgba(255,255,255,0.02); font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    
    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-outstanding { background: rgba(180, 83, 9, 0.2); color: #f97316; border: 1px solid rgba(180, 83, 9, 0.4); }
    .badge-paid { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.4); }

    .download-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .download-btn:hover { opacity: 0.9; }

    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
    .empty-state-icon { font-size: 2rem; margin-bottom: 10px; }

    #pdf-container {
      position: absolute;
      left: -9999px;
      top: 0;
      width: 794px;
      background: #ffffff;
      color: #000000;
      padding: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Statement of Account</h1>
    <div class="subtitle">Unified financial ledger for hourly logs and period-specific fixed retainers</div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Outstanding</h3>
        <div class="value" id="s-pending" style="color: var(--gold2);">$0.00</div>
      </div>
      <div class="stat-card">
        <h3>Total Confirmed Paid</h3>
        <div class="value" id="s-confirmed" style="color: var(--success);">$0.00</div>
      </div>
      <div class="stat-card">
        <h3>Active Entities</h3>
        <div class="value" id="s-upcoming">0</div>
      </div>
    </div>

    <div class="filters-bar">
      <div>
        <label for="client-select">Filter Client</label>
        <select id="client-select" onchange="applyTimeWindowFilters()">
          <option value="">All Clients</option>
        </select>
      </div>
      <div>
        <label for="start-date">Start Window</label>
        <input type="date" id="start-date" onchange="applyTimeWindowFilters()">
      </div>
      <div>
        <label for="end-date">End Window</label>
        <input type="date" id="end-date" onchange="applyTimeWindowFilters()">
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Statement Ref</th>
          <th>Client Name</th>
          <th>Billable Hours / Terms</th>
          <th>Unpaid Balance</th>
          <th>Paid Amount</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="invoice-records-table">
        <tr><td colspan="7" class="empty-state"><div class="empty-state-icon">⏳</div>Loading statement records...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="pdf-container"></div>

  <script>
    const API = '/api';
    const auth = {
      headers: () => ({ 'Authorization': 'Bearer ' + (localStorage.getItem('token') || '') })
    };

    let rawLogsData = [];
    let clientsData = [];
    let fixedPaymentsData = [];
    let generatingPDF = false;

    document.addEventListener('DOMContentLoaded', async () => {
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('start-date').value = "2026-01-01";
      document.getElementById('end-date').value = today;

      await populateClientSelector();
      await fetchMasterData();
    });

    async function populateClientSelector() {
      try {
        const res = await fetch(`${API}/clients`, { headers: auth.headers() });
        clientsData = await res.json();
        const selector = document.getElementById('client-select');
        selector.innerHTML = '<option value="">All Clients</option>';
        clientsData.forEach(c => {
          selector.innerHTML += `<option value="${c.name}">${c.name} (${c.rate_type || 'hourly'})</option>`;
        });
      } catch(e) { console.error("Client selector error:", e); }
    }

    async function fetchMasterData() {
      try {
        const [logsRes, clientsRes, fixedRes] = await Promise.all([
          fetch(`${API}/timelogs`, { headers: auth.headers() }),
          fetch(`${API}/clients`, { headers: auth.headers() }),
          fetch(`${API}/fixed-payments`, { headers: auth.headers() }).catch(() => ({ json: () => [] }))
        ]);
        
        rawLogsData = await logsRes.json();
        clientsData = await clientsRes.json();
        
        try {
          fixedPaymentsData = await fixedRes.json();
        } catch {
          fixedPaymentsData = [];
        }

        applyTimeWindowFilters();
      } catch(e) { console.error("Master data pull error:", e); }
    }

    function applyTimeWindowFilters() {
      const selectedClient = document.getElementById('client-select').value;
      const startVal = document.getElementById('start-date').value;
      const endVal = document.getElementById('end-date').value;

      const startTime = startVal ? new Date(startVal + "T00:00:00").getTime() : null;
      const endTime = endVal ? new Date(endVal + "T23:59:59").getTime() : null;

      const clientGroups = {};

      clientsData.forEach(c => {
        if (!selectedClient || c.name === selectedClient) {
          clientGroups[c.name] = { 
            rateType: c.rate_type || 'hourly',
            fixedRate: parseFloat(c.fixed_rate || 0),
            unpaidHours: 0, 
            totalUnpaid: 0, 
            totalPaid: 0,
            hasRecords: false
          };
        }
      });

      // Aggregate month-specific fixed-rate payments from fixed_monthly_payments endpoint
      fixedPaymentsData.forEach(fp => {
        const clientObj = clientsData.find(c => c.id === fp.client_id || c.name === fp.client_name);
        const clientName = clientObj ? clientObj.name : fp.client_name;

        if (!clientName) return;
        if (selectedClient && clientName !== selectedClient) return;

        const paymentMonthStr = fp.month ? `${fp.month}-01` : null;
        if (paymentMonthStr) {
          const paymentTime = new Date(paymentMonthStr + "T00:00:00").getTime();
          if (startTime && paymentTime < new Date(startVal.slice(0, 7) + "-01T00:00:00").getTime()) return;
          if (endTime && paymentTime > new Date(endVal.slice(0, 7) + "-28T23:59:59").getTime()) return;
        }

        if (!clientGroups[clientName]) {
          clientGroups[clientName] = { rateType: 'fixed', unpaidHours: 0, totalUnpaid: 0, totalPaid: 0, hasRecords: true };
        }

        clientGroups[clientName].hasRecords = true;
        const amount = parseFloat(fp.amount || 0);

        if (fp.status === 'paid') {
          clientGroups[clientName].totalPaid += amount;
        } else {
          clientGroups[clientName].totalUnpaid += amount;
        }
      });

      Object.keys(clientGroups).forEach(cName => {
        const group = clientGroups[cName];
        if (group.rateType === 'fixed' && !group.hasRecords) {
          const clientMeta = clientsData.find(c => c.name === cName);
          const baseVal = clientMeta ? parseFloat(clientMeta.fixed_rate || 0) : 0;
          group.totalUnpaid += baseVal;
        }
      });

      rawLogsData.forEach(l => {
        if (!l.date) return;
        const logTime = new Date(l.date.slice(0, 10) + "T12:00:00").getTime();
        
        const matchesClient = !selectedClient || l.client_name === selectedClient;
        const matchesStart = !startTime || logTime >= startTime;
        const matchesEnd = !endTime || logTime <= endTime;
        
        if (matchesClient && matchesStart && matchesEnd) {
          if(!clientGroups[l.client_name]) {
            clientGroups[l.client_name] = { rateType: 'hourly', unpaidHours: 0, totalUnpaid: 0, totalPaid: 0, hasRecords: true };
          }
          clientGroups[l.client_name].hasRecords = true;
          const amt = parseFloat(l.amount || 0);
          const hrs = parseFloat(l.hours || 0);
          
          if(l.payment_status !== 'paid') {
            clientGroups[l.client_name].unpaidHours += hrs;
            clientGroups[l.client_name].totalUnpaid += amt;
          } else {
            clientGroups[l.client_name].totalPaid += amt;
          }
        }
      });

      const tableBody = document.getElementById('invoice-records-table');
      const groupsArray = Object.keys(clientGroups).filter(k => clientGroups[k].hasRecords || clientGroups[k].rateType === 'fixed');

      let totalOutstanding = 0;
      let totalPaid = 0;
      groupsArray.forEach(client => {
        totalOutstanding += clientGroups[client].totalUnpaid;
        totalPaid += clientGroups[client].totalPaid;
      });

      document.getElementById('s-pending').textContent = '$' + totalOutstanding.toFixed(2);
      document.getElementById('s-confirmed').textContent = '$' + totalPaid.toFixed(2);
      document.getElementById('s-upcoming').textContent = groupsArray.length;

      if(!groupsArray.length) {
        tableBody.innerHTML = '<tr><td colspan="7" class="empty-state"><div class="empty-state-icon">📭</div><div>No statement records match your filters</div></td></tr>';
        return;
      }

      tableBody.innerHTML = groupsArray.map((client, idx) => {
        const data = clientGroups[client];
        const dummyInvId = `SOA-2026-${3000 + idx}`;
        const hasOutstanding = data.totalUnpaid > 0;
        
        return `
          <tr>
            <td><strong>${dummyInvId}</strong></td>
            <td><strong>${client}</strong> ${data.rateType === 'fixed' ? '<span style="font-size:0.7rem; color:var(--gold2);">(Fixed Retainer)</span>' : ''}</td>
            <td>${data.rateType === 'fixed' ? 'Monthly Commitment' : data.unpaidHours.toFixed(2) + ' hrs'}</td>
            <td style="color:${hasOutstanding ? '#f97316':'var(--success)'}; font-weight:700;">$${data.totalUnpaid.toFixed(2)}</td>
            <td style="color:var(--success); font-weight:600;">$${data.totalPaid.toFixed(2)}</td>
            <td>
              ${hasOutstanding ? '<span class="badge badge-outstanding">Outstanding</span>' 
                                : '<span class="badge badge-paid">Paid</span>'}
            </td>
            <td>
             <button class="download-btn" onclick="downloadInvoice('${dummyInvId}','${client}',${data.unpaidHours},${data.totalUnpaid},'${document.getElementById('start-date').value}','${document.getElementById('end-date').value}')">
              ⬇ PDF
             </button>
            </td>
          </tr>`;
      }).join('');
    }

    async function downloadInvoice(invoiceId, clientName, hours, amount, startDate, endDate) {
      if (generatingPDF) return;
      generatingPDF = true;

      const container = document.getElementById('pdf-container');
      container.innerHTML = `
        <div style="font-family: sans-serif; padding: 20px;">
          <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #3b82f6; padding-bottom: 15px; margin-bottom: 20px;">
            <div>
              <h2 style="margin: 0; color: #1e293b;">STATEMENT OF ACCOUNT</h2>
              <span style="color: #64748b; font-size: 0.85rem;">Ref: ${invoiceId}</span>
            </div>
            <div style="text-align: right;">
              <strong style="color: #1e293b;">Client:</strong><br/>
              <span style="color: #475569;">${clientName}</span>
            </div>
          </div>
          <div style="margin-bottom: 25px; font-size: 0.9rem; color: #475569;">
            <strong>Period Covered:</strong> ${startDate || 'N/A'} to ${endDate || 'N/A'}
          </div>
          <table style="width: 100%; border-collapse: collapse; margin-bottom: 25px;">
            <thead>
              <tr style="background: #f1f5f9; text-align: left;">
                <th style="padding: 10px; border: 1px solid #cbd5e1;">Billing Particulars</th>
                <th style="padding: 10px; border: 1px solid #cbd5e1;">Metric / Hours</th>
                <th style="padding: 10px; border: 1px solid #cbd5e1; text-align: right;">Total Balance</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style="padding: 10px; border: 1px solid #cbd5e1;">Statement Balance / Retainer Allocation</td>
                <td style="padding: 10px; border: 1px solid #cbd5e1;">${hours > 0 ? hours.toFixed(2) + ' hrs' : 'Fixed Rate Period'}</td>
                <td style="padding: 10px; border: 1px solid #cbd5e1; text-align: right; font-weight: bold;">$${amount.toFixed(2)}</td>
              </tr>
            </tbody>
          </table>
          <div style="text-align: right; font-size: 1.2rem; font-weight: bold; color: #1e293b;">
            Net Amount Due: $${amount.toFixed(2)}
          </div>
        </div>
      `;

      try {
        await document.fonts.ready;
        const opt = {
          margin: 10,
          filename: `${invoiceId}_${clientName.replace(/\s+/g, '_')}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, windowWidth: 794 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        await html2pdf().from(container).set(opt).save();
      } catch (err) {
        console.error("PDF generation failed:", err);
        alert("Could not generate statement PDF.");
      } finally {
        container.innerHTML = '';
        generatingPDF = false;
      }
    }
  </script>
</body>
</html>
