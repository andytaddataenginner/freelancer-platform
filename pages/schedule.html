<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Schedule — QFA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html {
      overflow-y: scroll;
    }

    :root {
      --navy: #0d2353; --navy2: #1a3a7a; --accent: #1a5cff; --gold: #c9952a; --gold2: #f5c842;
      --white: #fff; --bg: #f4f6fb; --bg2: #eef1f8;
      --ink: #0d2353; --ink2: #3a4a6a; --ink3: #7a8aaa;
      --green: #166534; --green-bg: #dcfce7; 
      --amber: #92400e; --amber-bg: #fef3c7;
      --red: #b91c1c; --red-bg: #fee2e2;
      --gray: #4b5563; --gray-bg: #f3f4f6;
      --serif: 'Playfair Display', serif; --sans: 'Outfit', sans-serif;
      --radius: 14px; --shadow: 0 2px 20px rgba(13,35,83,0.08);
    }
    body { font-family: var(--sans); background: var(--bg); color: var(--ink); }

    /* ── MOBILE TOP BAR ── */
    .mob-bar {
      display: none; position: fixed; top: 0; left: 0; right: 0; height: 52px;
      background: var(--navy); z-index: 200;
      align-items: center; justify-content: space-between;
      padding: 0 1rem; box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }
    .mob-brand { display: flex; align-items: center; gap: 0.5rem; }
    .mob-brand img { height: 28px; background: #fff; border-radius: 6px; padding: 2px; }
    .mob-brand span { color: #fff; font-size: 0.82rem; font-weight: 700; }
    .mob-btn { background: rgba(255,255,255,0.12); border: none; color: #fff; width: 36px; height: 36px; border-radius: 8px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    
    /* ── BLUR OVERLAY ── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 149; backdrop-filter: blur(2px); }
    .overlay.on { display: block; }

    /* ── SIDEBAR SYSTEM FRAMEWORK ── */
    .sidebar { width: 240px; background: var(--navy); position: fixed; top: 0; left: 0; height: 100vh; display: flex; flex-direction: column; z-index: 150; }
    .sb-brand { padding: 1.1rem 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 0.7rem; }
    .sb-logo { width: 36px; height: 36px; background: #fff; border-radius: 8px; overflow: hidden; padding: 3px; flex-shrink: 0; }
    .sb-logo img { width: 100%; height: 100%; object-fit: contain; }
    .sb-text strong { display: block; color: #fff; font-size: 0.8rem; font-weight: 700; }
    .sb-text span { font-size: 0.62rem; color: var(--gold2); text-transform: uppercase; letter-spacing: 0.08em; }
    
    .sb-nav { flex: 1; padding: 0.8rem 0; overflow-y: auto; }
    .sb-nav a { display: flex; align-items: center; gap: 0.7rem; padding: 0.7rem 1.2rem; font-size: 0.85rem; font-weight: 500; color: rgba(255,255,255,0.55); text-decoration: none; transition: all 0.2s; border-right: 3px solid transparent; }
    .sb-nav a:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .sb-nav a.active { color: #fff; background: rgba(26,92,255,0.2); border-right-color: var(--gold2); }
    
    .sb-user { padding: 1rem 1.2rem; border-top: 1px solid rgba(255,255,255,0.08); }
    .sb-user strong { display: block; color: #fff; font-size: 0.88rem; }
    .sb-user span { font-size: 0.72rem; color: rgba(255,255,255,0.4); }
    .sb-user a { display: block; margin-top: 0.4rem; font-size: 0.75rem; color: var(--gold2); text-decoration: none; }

    /* ── MAIN WORKSPACE PANEL ── */
    .main { margin-left: 240px; min-height: 100vh; overflow-x: hidden; }
    .topbar { background: #fff; border-bottom: 1px solid rgba(13,35,83,0.08); padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem; }
    .topbar h2 { font-family: var(--serif); font-size: 1.4rem; letter-spacing: -0.02em; }
    .topbar p { font-size: 0.8rem; color: var(--ink3); margin-top: 0.1rem; }
    .content { padding: 1.5rem; }

    /* ── CARDS ── */
    .card {
      background: white; border-radius: var(--radius); padding: 1.2rem;
      box-shadow: var(--shadow); border: 1px solid rgba(13,35,83,0.05);
      margin-bottom: 1.2rem;
    }

    /* ── STATS CARDS ── */
    .stat-card {
      background: white; border-radius: var(--radius); padding: 1.2rem;
      box-shadow: var(--shadow); border: 1px solid rgba(13,35,83,0.05);
      display: flex; flex-direction: column; gap: 0.2rem;
    }
    .stat-num { font-size: 1.8rem; font-weight: 600; color: var(--navy); line-height: 1.2; }
    .stat-label { font-size: 0.78rem; font-weight: 500; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.04em; }

    /* ── BADGES ── */
    .badge { display: inline-block; padding: 0.18rem 0.6rem; border-radius: 100px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    .badge-green { background: var(--green-bg); color: var(--green); }
    .badge-amber { background: var(--amber-bg); color: var(--amber); }
    .badge-blue  { background: #dbeafe; color: #1e40af; }
    .badge-gray  { background: var(--gray-bg); color: var(--gray); }

    /* ── BUTTONS ── */
    .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.72rem; border-radius: 5px; border: none; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; }
    .btn-green  { background: var(--green-bg); color: var(--green); }
    .btn-green:hover { background: var(--green); color: white; }
    .btn-red    { background: var(--red-bg); color: var(--red); }
    .btn-red:hover { background: var(--red); color: white; }
    .btn-outline { background: transparent; border: 1.5px solid rgba(13,35,83,0.15); color: var(--ink2); padding: 0.35rem 0.7rem; font-size: 0.72rem; border-radius: 5px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; }
    .btn-outline:hover { border-color: var(--navy); color: var(--navy); }
    
    /* ── ACTIVE FILTER STYLING ── */
    .btn-filter-toggle.active {
      background: var(--navy) !important;
      color: white !important;
      border-color: var(--navy) !important;
    }

    /* ── TABLES ── */
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    th { padding: 0.8rem; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink3); border-bottom: 1px solid var(--bg2); }
    td { padding: 0.9rem 0.8rem; border-bottom: 1px solid var(--bg2); color: var(--ink2); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }

    /* ── BREAKPOINTS RESPONSIVE ENGINE ── */
    @media (max-width: 768px) {
      .mob-bar { display: flex; }
      .sidebar { transform: translateX(-100%); transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1); width: 240px; }
      .sidebar.open { transform: translateX(0); box-shadow: 4px 0 32px rgba(0,0,0,0.3); }
      .main { margin-left: 0; padding-top: 52px; }
      
      /* FIX: Changes sticky position to static on mobile so it cleanly scrolls out of view */
      .topbar { position: static !important; padding: 1.2rem 1rem 0.8rem !important; } 
      
      .content { padding: 1rem; }
      .stats-row { grid-template-columns: 1fr 1fr !important; gap: 0.8rem !important; display: grid !important; }
    }
    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr !important; }
      .card-header { flex-direction: column !important; align-items: flex-start !important; gap: 0.8rem !important; }
      .card-header div { width: 100%; display: flex; gap: 0.4rem; }
      .card-header button { flex: 1; text-align: center; }
    }
  </style>
</head>
