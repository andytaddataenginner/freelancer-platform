<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clients — QFA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0d2353; --accent: #1a5cff; --gold2: #f5c842;
      --white: #fff; --bg: #f4f6fb; --bg2: #eef1f8;
      --ink: #0d2353; --ink2: #3a4a6a; --ink3: #7a8aaa;
      --green: #166534; --green-bg: #dcfce7;
      --amber: #92400e; --amber-bg: #fef3c7;
      --red: #b91c1c; --red-bg: #fee2e2;
      --gray: #4b5563; --gray-bg: #f3f4f6;
      --sans: 'Outfit', system-ui, sans-serif;
      --serif: 'Playfair Display', serif;
      --radius: 14px; --shadow: 0 2px 20px rgba(13,35,83,0.08);
    }
    html, body { font-family: var(--sans); background: var(--bg); color: var(--ink); }

    /* ── LAYOUT ── */
    .layout { display: flex; min-height: 100vh; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 220px; background: var(--navy); position: fixed;
      top: 0; left: 0; height: 100vh; display: flex;
      flex-direction: column; z-index: 50;
      transition: transform 0.3s ease;
    }
    .sidebar-brand {
      padding: 1.1rem 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; gap: 0.6rem;
    }
    .brand-logo { width: 36px; height: 36px; background: white; border-radius: 8px; overflow: hidden; padding: 3px; flex-shrink: 0; }
    .brand-logo img { width: 100%; height: 100%; object-fit: contain; }
    .brand-text strong { display: block; color: white; font-size: 0.78rem; font-weight: 700; }
    .brand-text span { font-size: 0.62rem; color: var(--gold2); text-transform: uppercase; letter-spacing: 0.08em; }

    .sidebar-nav { flex: 1; padding: 0.8rem 0; overflow-y: auto; }
    .sidebar-nav a {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.7rem 1.2rem; font-size: 0.85rem; font-weight: 500;
      color: rgba(255,255,255,0.55); text-decoration: none;
      transition: all 0.2s; border-right: 3px solid transparent;
    }
    .sidebar-nav a:hover { color: white; background: rgba(255,255,255,0.06); }
    .sidebar-nav a.active { color: white; background: rgba(26,92,255,0.2); border-right-color: var(--gold2); }

    .sidebar-user {
      padding: 1rem 1.2rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 0.8rem;
    }
    .sidebar-user strong { display: block; color: white; margin-bottom: 0.1rem; }
    .sidebar-user span { color: rgba(255,255,255,0.4); font-size: 0.72rem; }
    .sidebar-user a { display: block; margin-top: 0.4rem; font-size: 0.75rem; color: var(--gold2); text-decoration: none; }

    /* ── MOBILE NAV ── */
    .mobile-header {
      display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 60;
      background: var(--navy); padding: 0.8rem 1rem;
      align-items: center; justify-content: space-between;
      box-shadow: 0 2px 12px rgba(13,35,83,0.2);
    }
    .mobile-logo { display: flex; align-items: center; gap: 0.5rem; }
    .mobile-logo img { height: 32px; background: white; border-radius: 6px; padding: 2px; }
    .mobile-logo span { color: white; font-size: 0.85rem; font-weight: 700; }
    .hamburger-btn {
      background: rgba(255,255,255,0.1); border: none; color: white;
      width: 36px; height: 36px; border-radius: 8px; font-size: 1.1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .sidebar-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 45;
    }
    .sidebar-overlay.open { display: block; }
    .sidebar.mobile-open { transform: translateX(0) !important; }

    /* ── MAIN ── */
    .main { margin-left: 220px; flex: 1; }

    .topbar {
      background: white; border-bottom: 1px solid rgba(13,35,83,0.08);
      padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 40;
    }
    .topbar h2 { font-family: var(--serif); font-size: 1.4rem; }
    .topbar p  { font-size: 0.8rem; color: var(--ink3); margin-top: 0.1rem; }

    .content { padding: 1.5rem; }

    /* ── CARDS ── */
    .card {
      background: white; border-radius: var(--radius);
      box-shadow: var(--shadow); border: 1px solid rgba(13,35,83,0.05);
      margin-bottom: 1.2rem;
    }
    .card-header {
      padding: 1rem 1.2rem; border-bottom: 1px solid var(--bg2);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
    }
    .card-header h3 { font-size: 0.9rem; font-weight: 700; color: var(--navy); }

    /* ── TABLE ── */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 700px; }
    th { padding: 0.6rem 0.8rem; font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink3); border-bottom: 2px solid var(--bg2); font-weight: 700; text-align: left; white-space: nowrap; }
    td { padding: 0.75rem 0.8rem; border-bottom: 1px solid var(--bg2); color: var(--ink2); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg); }

    /* ── BADGES ── */
    .badge { display: inline-block; padding: 0.18rem 0.6rem; border-radius: 100px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    .badge-green { background: var(--green-bg); color: var(--green); }
    .badge-amber { background: var(--amber-bg); color: var(--amber); }
    .badge-blue  { background: #dbeafe; color: #1e40af; }

    /* ── BUTTONS ── */
    .btn { padding: 0.45rem 0.9rem; border-radius: 7px; font-family: var(--sans); font-size: 0.78rem; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.3rem; white-space: nowrap; }
    .btn-green  { background: var(--green-bg); color: var(--green); }
    .btn-green:hover { background: var(--green); color: white; }
    .btn-red    { background: var(--red-bg); color: var(--red); }
    .btn-red:hover { background: var(--red); color: white; }
    .btn-outline { background: transparent; border: 1.5px solid rgba(13,35,83,0.15); color: var(--ink2); }
    .btn-outline:hover { border-color: var(--navy); color: var(--navy); }
    .btn-navy   { background: var(--navy); color: white; }
    .btn-navy:hover { background: var(--accent); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); width: 240px; }
      .main { margin-left: 0; padding-top: 56px; }
      .mobile-header { display: flex; }
      .topbar { top: 56px; }
      .content { padding: 1rem; }
    }
  </style>
</head>
<body>

<!-- Mobile header -->
<div class="mobile-header" id="mobile-header">
  <div class="mobile-logo">
    <img src="../QFA_Logo.png" alt="QFA"/>
    <span>QFA</span>
  </div>
  <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
</div>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<div class="layout">
  <!-- Sidebar Engine -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo"><img src="../QFA_Logo.png" alt="QFA"/></div>
      <div class="brand-text"><strong>Quick Freelancing</strong><span>Agency</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">📊 Overview</a>
      <a href="time-logs.html">⏱ Time Logs</a>
      <a href="clients.html" class="active">👥 Clients</a>
      <a href="schedule.html">📅 Schedule</a>
      <a href="portfolio-admin.html">🖼 Portfolio</a>
      <a href="../index.html" target="_blank">🌐 Public Site</a>
    </nav>
    <div class="sidebar-user">
      <strong id="user-name">Loading…</strong>
      <span>Freelancer · QFA</span>
      <a href="#" onclick="logout()">Sign out →</a>
    </div>
  </aside>

  <!-- Main Platform Container Area -->
  <div class="main">
    <div class="topbar">
      <h2>Clients</h2>
      <p>Manage your client accounts, rate configurations, and assignments.</p>
    </div>

    <div class="content">
      <!-- Your Dynamic Client Content/Tables Go inside here -->
      <div class="card">
        <div class="card-header">
          <h3>All Active Clients</h3>
        </div>
        <div class="table-wrap">
          <!-- Formatted table layout matches time logs style sheets exactly -->
          <table>
            <thead>
              <tr>
                <th>Client Name</th>
                <th>Company</th>
                <th>Rate Setup</th>
                <th>Rate Value</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- Keep your existing JavaScript engine rendering rows smoothly here -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
// Keep all your current script logic below here intact.
// Make sure to add the standard sidebar helper hook:
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('mobile-open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}
</script>
</body>
</html>
