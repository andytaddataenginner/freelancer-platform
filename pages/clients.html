<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clients — QFA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght=700&family=Outfit:wght=300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0d2353; --accent: #1a5cff; --gold2: #f5c842;
      --white: #fff; --bg: #f4f6fb; --bg2: #eef1f8;
      --ink: #0d2353; --ink2: #3a4a6a; --ink3: #7a8aaa;
      --green: #166534; --green-bg: #dcfce7;
      --amber: #92400e; --amber-bg: #fef3c7;
      --red: #b91c1c; --red-bg: #fee2e2;
      --sans: 'Outfit', system-ui, sans-serif;
      --serif: 'Playfair Display', serif;
      --radius: 14px; --shadow: 0 2px 20px rgba(13,35,83,0.08);
    }
    html, body { font-family: var(--sans); background: var(--bg); color: var(--ink); }

    .layout { display: flex; min-height: 100vh; }

    .sidebar {
      width: 220px; background: var(--navy); position: fixed;
      top: 0; left: 0; height: 100vh; display: flex;
      flex-direction: column; z-index: 50;
      transition: transform 0.3s ease;
    }
    .sidebar-brand {
      padding: 1.1rem 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; gap: 0.6rem;
    }
    .brand-logo { width: 36px; height: 36px; background: white; border-radius: 8px; overflow: hidden; padding: 3px; flex-shrink: 0; }
    .brand-logo img { width: 100%; height: 100%; object-fit: contain; }
    .brand-text strong { display: block; color: white; font-size: 0.78rem; font-weight: 700; }
    .brand-text span { font-size: 0.62rem; color: var(--gold2); text-transform: uppercase; letter-spacing: 0.08em; }

    .sidebar-nav { flex: 1; padding: 0.8rem 0; overflow-y: auto; }
    .sidebar-nav a {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.7rem 1.2rem; font-size: 0.85rem; font-weight: 500;
      color: rgba(255,255,255,0.55); text-decoration: none;
      transition: all 0.2s; border-right: 3px solid transparent;
    }
    .sidebar-nav a:hover { color: white; background: rgba(255,255,255,0.06); }
    .sidebar-nav a.active { color: white; background: rgba(26,92,255,0.2); border-right-color: var(--gold2); }

    .sidebar-user {
      padding: 1rem 1.2rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 0.8rem;
    }
    .sidebar-user strong { display: block; color: white; margin-bottom: 0.1rem; }
    .sidebar-user span { color: rgba(255,255,255,0.4); font-size: 0.72rem; }
    .sidebar-user a { display: block; margin-top: 0.4rem; font-size: 0.75rem; color: var(--gold2); text-decoration: none; }

    .mobile-header {
      display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 60;
      background: var(--navy); padding: 0.8rem 1rem;
      align-items: center; justify-content: space-between;
      box-shadow: 0 2px 12px rgba(13,35,83,0.2);
    }
    .mobile-logo { display: flex; align-items: center; gap: 0.5rem; }
    .mobile-logo img { height: 32px; background: white; border-radius: 6px; padding: 2px; }
    .mobile-logo span { color: white; font-size: 0.85rem; font-weight: 700; }
    .hamburger-btn {
      background: rgba(255,255,255,0.1); border: none; color: white;
      width: 36px; height: 36px; border-radius: 8px; font-size: 1.1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 45; }
    .sidebar-overlay.open { display: block; }
    .sidebar.mobile-open { transform: translateX(0) !important; }

    .main { margin-left: 220px; flex: 1; }
    .topbar {
      background: white; border-bottom: 1px solid rgba(13,35,83,0.08);
      padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 40;
    }
    .topbar h2 { font-family: var(--serif); font-size: 1.4rem; }
    .topbar p  { font-size: 0.8rem; color: var(--ink3); margin-top: 0.1rem; }

    .content { padding: 1.5rem; }
    
    .clients-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.2rem; margin-top: 1rem;
    }

    .card {
      background: white; border-radius: var(--radius); padding: 1.2rem;
      box-shadow: var(--shadow); border: 1px solid rgba(13,35,83,0.05);
      margin-bottom: 1.2rem; display: flex; flex-direction: column; justify-content: space-between;
    }
    
    .badge { display: inline-block; padding: 0.18rem 0.6rem; border-radius: 100px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
    .badge-green { background: var(--green-bg); color: var(--green); }
    .badge-blue  { background: #dbeafe; color: #1e40af; }
    .badge-gray  { background: var(--gray-bg); color: var(--gray); }

    .btn-primary { background: var(--navy); color: white; padding: 0.65rem 1.2rem; font-size: 0.82rem; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.3rem; }
    .btn-primary:hover { background: var(--accent); }
    .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.72rem; border-radius: 5px; border: none; cursor: pointer; font-weight: 600; }
    .btn-outline { background: transparent; border: 1.5px solid rgba(13,35,83,0.15); color: var(--ink2); }
    .btn-outline:hover { border-color: var(--navy); color: var(--navy); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(13,35,83,0.5); display: none; align-items: center; justify-content: center; z-index: 200; padding: 1rem; backdrop-filter: blur(4px); }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: 18px; padding: 1.8rem; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 80px rgba(13,35,83,0.2); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.4rem; }
    .modal-close { background: var(--bg); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.9rem; }
    .form-group label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--ink2); }
    .form-group input, .form-group select, .form-group textarea { padding: 0.65rem 0.8rem; border: 1.5px solid rgba(13,35,83,0.1); border-radius: 8px; background: var(--bg); font-family: var(--sans); font-size: 0.88rem; color: var(--navy); width: 100%; }
    .form-status { font-size: 0.8rem; margin-top: 0.2rem; }
    .form-status.success { color: var(--green); }
    .form-status.error { color: var(--red); }
  </style>
</head>
<body>

  <div class="mobile-header" id="mobile-header">
    <div class="mobile-logo"><img src="../QFA_Logo.png" alt="QFA"/><span>QFA</span></div>
    <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo"><img src="../QFA_Logo.png" alt="QFA"/></div>
        <div class="brand-text"><strong>Quick Freelancing</strong><span>Agency</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">📊 Overview</a>
        <a href="time-logs.html">⏱ Time Logs</a>
        <a href="clients.html" class="active">👥 Clients</a>
        <a href="schedule.html">📅 Schedule</a>
        <a href="portfolio-admin.html">🖼 Portfolio</a>
        <a href="../index.html" target="_blank">🌐 Public Site</a>
      </nav>
      <div class="sidebar-user">
        <strong id="user-name">Loading…</strong>
        <span>Freelancer · QFA</span>
        <a href="#" onclick="logout()">Sign out →</a>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div style="display:flex; justify-content:space-between; align-items:center; width:100%; flex-wrap:wrap; gap:1rem;">
          <div>
            <h2>Clients Directory</h2>
            <p>View current configuration architectures and available credits layout profiles.</p>
          </div>
          <button class="btn-primary" onclick="openModal('modal-add')">＋ Add New Client</button>
        </div>
      </div>

      <div class="content">
        <div class="clients-grid" id="clients-list"></div>
      </div>
    </div>
  </div>

  <!-- MODAL: ADD CLIENT -->
  <div class="modal-overlay" id="modal-add">
    <div class="modal">
      <div class="modal-header">
        <h3>Add Client</h3>
        <button class="modal-close" onclick="closeModal('modal-add')">×</button>
      </div>
      <form onsubmit="addClient(event)">
        <div class="form-group"><label>Full Name</label><input type="text" name="name" required/></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" required/></div>
        <div class="form-group"><label>Company</label><input type="text" name="company"/></div>
        <div class="form-group">
          <label>Rate Strategy Type</label>
          <select name="rate_type" onchange="toggleFormRateFields(this.value, 'add')">
            <option value="hourly">Hourly Basis</option>
            <option value="fixed">Fixed Price Project</option>
          </select>
        </div>
        <div class="form-group" id="add-hourly-box"><label>Hourly Rate ($)</label><input type="number" step="0.01" name="hourly_rate" value="0.00"/></div>
        <div class="form-group" id="add-fixed-box" style="display:none;"><label>Fixed Rate ($)</label><input type="number" step="0.01" name="fixed_price" value="0.00"/></div>
        <div class="form-group"><label>Initial Account Credit Balance ($)</label><input type="number" step="0.01" name="credit_balance" value="0.00"/></div>
        <div id="add-status" class="form-status"></div>
        <button type="submit" class="btn-primary" style="width:100%; justify-content:center; margin-top:0.5rem;">Create Client Record</button>
      </form>
    </div>
  </div>

  <!-- MODAL: EDIT CLIENT -->
  <div class="modal-overlay" id="modal-edit">
    <div class="modal">
      <div class="modal-header">
        <h3>Edit Client Parameters</h3>
        <button class="modal-close" onclick="closeModal('modal-edit')">×</button>
      </div>
      <form onsubmit="saveClient(event)">
        <input type="hidden" id="edit-id" name="id"/>
        <div class="form-group"><label>Full Name</label><input type="text" id="edit-name" name="name" required/></div>
        <div class="form-group"><label>Company</label><input type="text" id="edit-company" name="company"/></div>
        <div class="form-group">
          <label>Rate Strategy Type</label>
          <select id="edit-rate-type" name="rate_type" onchange="toggleFormRateFields(this.value, 'edit')">
            <option value="hourly">Hourly Basis</option>
            <option value="fixed">Fixed Price Project</option>
          </select>
        </div>
        <div class="form-group" id="edit-hourly-box"><label>Hourly Rate ($)</label><input type="number" step="0.01" id="edit-hourly-rate" name="hourly_rate"/></div>
        <div class="form-group" id="edit-fixed-box" style="display:none;"><label>Fixed Rate ($)</label><input type="number" step="0.01" id="edit-fixed-price" name="fixed_price"/></div>
        <div class="form-group"><label>Modify Credits Balance ($)</label><input type="number" step="0.01" id="edit-credit-balance" name="credit_balance"/></div>
        <div id="edit-status" class="form-status"></div>
        <button type="submit" class="btn-primary" style="width:100%; justify-content:center; margin-top:0.5rem;">Save Ledger Profile</button>
      </form>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script>
    let allClients = [];
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('mobile-open');
      document.getElementById('sidebar-overlay').classList.toggle('open');
    }
    function toggleFormRateFields(val, prefix) {
      document.getElementById(`${prefix}-hourly-box`).style.display = val === 'fixed' ? 'none' : 'block';
      document.getElementById(`${prefix}-fixed-box`).style.display = val === 'fixed' ? 'block' : 'none';
    }
    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    async function loadClients() {
      try {
        const u = await apiFetch('/auth/me');
        if(u) document.getElementById('user-name').textContent = u.name;
        allClients = await apiFetch('/clients');
        renderClients(allClients);
      } catch(e) { window.location.href = 'login.html'; }
    }

    function renderClients(clients) {
      const container = document.getElementById('clients-list');
      if(!clients.length) {
        container.innerHTML = `<p style="grid-column:1/-1; text-align:center; padding:2rem; color:var(--ink3);">No active profiles mapped.</p>`;
        return;
      }
      container.innerHTML = clients.map(c => {
        const credit = parseFloat(c.credit_balance || 0);
        return `
          <div class="card">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:0.5rem;">
                <div>
                  <h3 style="font-size:1.1rem; color:var(--navy); font-weight:600;">${escapeHTML(c.name)}</h3>
                  <p style="font-size:0.8rem; color:var(--ink3);">${escapeHTML(c.company || 'Individual')}</p>
                </div>
                <span class="badge ${c.rate_type === 'fixed' ? 'badge-blue' : 'badge-gray'}">${c.rate_type}</span>
              </div>
              <div style="margin-top:1rem; padding-top:0.5rem; border-top:1px solid var(--bg2); font-size:0.85rem;">
                <p style="margin-bottom:0.3rem;"><strong>Contract Rate:</strong> ${c.rate_type==='fixed' ? `$${parseFloat(c.fixed_price||0).toFixed(2)}` : `$${parseFloat(c.hourly_rate||0).toFixed(2)}/hr`}</p>
                
                <!-- CREDIT BALANCES REMITTANCE LEDGER MONITOR -->
                <div style="margin-top:0.8rem; padding:0.6rem 0.8rem; background:${credit > 0 ? 'var(--green-bg)' : 'var(--bg2)'}; border-radius:6px;">
                  <span style="font-size:0.7rem; font-weight:700; color:var(--ink2); text-transform:uppercase; display:block;">Available Credits Ledger</span>
                  <strong style="font-size:1.05rem; color:${credit > 0 ? 'var(--green)' : 'var(--navy)'};">$${credit.toFixed(2)}</strong>
                </div>
              </div>
            </div>
            <button class="btn-outline btn-sm" style="margin-top:1rem; width:100%; text-align:center;" onclick="openEditModal(${c.id})">Configure Rates / Credits</button>
          </div>
        `;
      }).join('');
    }

    function openEditModal(id) {
      const c = allClients.find(item => item.id == id);
      if(!c) return;
      document.getElementById('edit-id').value = c.id;
      document.getElementById('edit-name').value = c.name;
      document.getElementById('edit-company').value = c.company || '';
      document.getElementById('edit-rate-type').value = c.rate_type || 'hourly';
      document.getElementById('edit-hourly-rate').value = c.hourly_rate || 0;
      document.getElementById('edit-fixed-price').value = c.fixed_price || 0;
      document.getElementById('edit-credit-balance').value = c.credit_balance || 0;
      toggleFormRateFields(c.rate_type, 'edit');
      openModal('modal-edit');
    }

    async function addClient(e) {
      e.preventDefault();
      const status = document.getElementById('add-status');
      try {
        await apiFetch('/clients', { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
        closeModal('modal-add'); loadClients();
      } catch(err) { status.textContent = err.message; }
    }

    async function saveClient(e) {
      e.preventDefault();
      const status = document.getElementById('edit-status');
      try {
        const data = Object.fromEntries(new FormData(e.target));
        await apiFetch('/clients/' + data.id, { method: 'PUT', body: JSON.stringify(data) });
        closeModal('modal-edit'); loadClients();
      } catch(err) { status.textContent = err.message; }
    }

    function escapeHTML(str) {
      if(!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
    window.addEventListener('DOMContentLoaded', loadClients);
  </script>
</body>
</html>
