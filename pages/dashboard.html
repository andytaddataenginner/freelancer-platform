<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — QFA</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html { overflow-y: scroll; }
    :root{
      --navy:#0d2353;--navy2:#1a3a7a;--accent:#1a5cff;--gold:#c9952a;--gold2:#f5c842;
      --white:#fff;--bg:#f4f6fb;--bg2:#eef1f8;
      --ink:#0d2353;--ink2:#3a4a6a;--ink3:#7a8aaa;
      --green:#166534;--gbg:#dcfce7;--amber:#92400e;--abg:#fef3c7;
      --red:#b91c1c;--rbg:#fee2e2;
      --serif:'Playfair Display',serif;--sans:'Outfit',sans-serif;
      --r:14px;--sh:0 2px 20px rgba(13,35,83,.08);
    }
    body{font-family:var(--sans);background:var(--bg);color:var(--ink)}

    /* ── SIDEBAR & MAIN (Simplified for brevity) ── */
    .sidebar{width:240px;background:var(--navy);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:150;}
    .sb-brand{padding:1.1rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:.7rem}
    .sb-nav{flex:1;padding:.8rem 0;overflow-y:auto}
    .sb-nav a{display:flex;align-items:center;gap:.7rem;padding:.7rem 1.2rem;font-size:.85rem;color:rgba(255,255,255,.55);text-decoration:none;border-right:3px solid transparent}
    .sb-nav a.active{color:#fff;background:rgba(26,92,255,.2);border-right-color:var(--gold2)}
    .main{margin-left:240px;min-height:100vh;padding:1.5rem}

    /* ── CARDS & FORM ── */
    .card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);border:1px solid rgba(13,35,83,.05);margin-bottom:1.2rem}
    .ch{padding:1rem 1.4rem;border-bottom:1px solid var(--bg2);font-weight:700}
    .cb{padding:1.4rem}
    .fg{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.9rem}
    .fg label{font-size:.72rem;font-weight:700;text-transform:uppercase;color:var(--ink2)}
    input,select,textarea{width:100%;padding:.7rem .9rem;border:1.5px solid rgba(13,35,83,.1);border-radius:9px;background:var(--bg)}
    .btn{padding:.6rem 1.2rem;border-radius:8px;font-weight:600;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
    .btn-p{background:var(--navy);color:#fff}
    
    /* ── LAYOUT FIX FOR NEW SECTION ── */
    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-brand"><strong>Quick Freelancing Agency</strong></div>
  <nav class="sb-nav">
    <a href="dashboard.html" class="active">📊 Overview</a>
    <a href="time-logs.html">⏱ Time Logs</a>
    <a href="clients.html">👥 Clients</a>
  </nav>
</aside>

<main class="main">
  <h2>Dashboard</h2>
  
  <div class="grid-container">
    <div class="card">
      <div class="ch">⏱ Live Timer</div>
      <div class="cb">
        <div class="fg"><label>Client</label><select id="tc"><option value="">Select client…</option></select></div>
        <div class="timer-disp" id="tdisp" style="font-size:2rem; text-align:center; margin:1rem 0;">00:00:00</div>
        <button class="btn btn-p" onclick="startTimer()" id="tstart">▶ Start</button>
      </div>
    </div>

    <div class="card">
      <div class="ch">🧾 Generate Fixed Invoice</div>
      <div class="cb">
        <form onsubmit="generateFixedInvoice(event)">
          <div class="fg"><label>Fixed Rate Client</label><select id="invoice-client-target" required></select></div>
          <div style="display:flex; gap: 0.5rem;">
            <div class="fg" style="flex:1;"><label>Month</label><input type="number" id="invoice-month" min="1" max="12" required/></div>
            <div class="fg" style="flex:1;"><label>Year</label><input type="number" id="invoice-year" required/></div>
          </div>
          <button type="submit" class="btn btn-p" style="width:100%">Generate Invoice</button>
        </form>
      </div>
    </div>
  </div>
</main>

<script>
const API = 'https://freelancer-platform-9jut.onrender.com/api';
// Helper to include auth headers
const getHeaders = () => ({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') });

// Load initial data
async function init() {
  const res = await fetch(API + '/clients', { headers: getHeaders() });
  const clients = await res.json();
  
  // Populate dropdowns
  const opts = clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('tc').innerHTML += opts;
  document.getElementById('invoice-client-target').innerHTML = '<option value="">Select client...</option>' + opts;

  // Set default dates
  document.getElementById('invoice-month').value = new Date().getMonth() + 1;
  document.getElementById('invoice-year').value = new Date().getFullYear();
}

// Function to handle Fixed Invoice Generation
async function generateFixedInvoice(e) {
  e.preventDefault();
  const client_id = document.getElementById('invoice-client-target').value;
  const billing_month = document.getElementById('invoice-month').value;
  const billing_year = document.getElementById('invoice-year').value;

  try {
    const res = await fetch(API + '/fixed-invoices', {
      method: 'POST',
      headers: getHeaders(),
      body: JSON.stringify({ client_id: parseInt(client_id), billing_month: parseInt(billing_month), billing_year: parseInt(billing_year) })
    });
    if (!res.ok) throw new Error('Generation failed');
    alert('Invoice Snapshot Created!');
  } catch (err) {
    alert(err.message);
  }
}

// Existing timer logic (placeholder for brevity)
function startTimer() { alert('Timer started (logic from original file)'); }

init();
</script>
</body>
</html>
